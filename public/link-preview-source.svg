  <text x="1014" y="362" fill="#64245F" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">✦ PRIZE WINNER</text>

  <path d="M820 418H1134" stroke="white" stroke-opacity="0.14"/>
  <text x="820" y="452" fill="white" fill-opacity="0.46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">BUILT BY</text>
