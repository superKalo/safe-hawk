  <text x="840" y="301" fill="#20102F" fill-opacity="0.48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">ETHSOFIA 2024</text>
  <text x="840" y="330" fill="#20102F" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">iExec Prize</text>
